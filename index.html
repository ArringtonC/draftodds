<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DraftOdds — Legal</title>
<style>
  :root { --ink:#0B0F0D; --panel:#121815; --line:#222C27; --text:#EAF2EE; --muted:#9BAAA2; --green:#2CE5A0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ink); color:var(--text);
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         -webkit-font-smoothing:antialiased; }
  .wrap { max-width:720px; margin:0 auto; padding:64px 22px 96px; }
  .brand { font-weight:800; font-size:22px; letter-spacing:-.02em; }
  .brand span { color:var(--green); }
  h1 { font-size:34px; letter-spacing:-.02em; margin:28px 0 6px; }
  p.sub { color:var(--muted); margin:0 0 32px; }
  .cards { display:grid; gap:14px; margin-top:24px; }
  a.card { display:block; text-decoration:none; color:var(--text);
           background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px 22px; }
  a.card:hover { border-color:var(--green); }
  a.card b { display:block; font-size:18px; }
  a.card small { color:var(--muted); }
  footer { color:var(--muted); font-size:13px; margin-top:48px; }
  footer a { color:var(--green); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Draft<span>Odds</span></div>
    <h1>Legal</h1>
    <p class="sub">Draft coach for fantasy football. Privacy-first, on-device.</p>
    <div class="cards">
      <a class="card" href="./privacy"><b>Privacy Policy →</b><small>What the app collects (spoiler: it stays on your device).</small></a>
      <a class="card" href="./terms"><b>Terms of Use (EULA) →</b><small>License, subscription terms, disclaimers.</small></a>
    </div>
    <footer>© 2026 DraftOdds · <a href="mailto:support@draftodds.app">support@draftodds.app</a></footer>
  </div>
</body>
</html>
